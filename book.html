<!DOCTYPE html>
<html>
<head>
    <title>Book Room - Off-Campus Room Finder</title>

    <!-- ✅ Important for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            color: #0072ff;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #0072ff;
            box-shadow: 0 0 5px rgba(0,114,255,0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Mobile optimization */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
                border-radius: 15px;
            }

            h2 {
                font-size: 20px;
            }

            input {
                padding: 10px;
            }

            button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Book Room</h2>

    <form>
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Room Name / ID</label>
            <input type="text" placeholder="Enter room ID" required>
        </div>

        <div class="input-group">
            <label>Start Date</label>
            <input type="date" required>
        </div>

        <div class="input-group">
            <label>End Date</label>
            <input type="date" required>
        </div>

        <button type="submit">Confirm Booking</button>
    </form>
</div>

</body>
</html>
